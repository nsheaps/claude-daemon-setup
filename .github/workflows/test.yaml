name: test

# `mise run test` (bun test) — split from check.yaml per docs/specs/draft/ci-workflows.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # ref-based: never cancel main, always cancel superseded PR runs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise and tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5

      - name: mise run test
        run: mise run test
